<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>My Gallery</h1>
    <p>A responsive image gallery with lightbox</p>
  </header>

  <!-- Filter buttons -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="nature">Nature</button>
    <button class="filter-btn" data-filter="city">City</button>
    <button class="filter-btn" data-filter="animals">Animals</button>
  </div>

  <!-- Gallery grid -->
  <div class="gallery">
    <div class="gallery-item" data-category="nature">
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800" alt="Nature 1" />
    </div>
    <div class="gallery-item" data-category="city">
      <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=800" alt="City 1" />
    </div>
    <div class="gallery-item" data-category="animals">
      <img src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=800" alt="Animal 1" />
    </div>
    <div class="gallery-item" data-category="nature">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Nature 2" />
    </div>
    <div class="gallery-item" data-category="city">
      <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=800" alt="City 2" />
    </div>
    <div class="gallery-item" data-category="animals">
      <img src="https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=800" alt="Animal 2" />
    </div>
    <div class="gallery-item" data-category="nature">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800" alt="Nature 3" />
    </div>
    <div class="gallery-item" data-category="city">
      <img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=800" alt="City 3" />
    </div>
    <div class="gallery-item" data-category="animals">
      <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=800" alt="Animal 3" />
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="close">&times;</span>
    <span class="prev">&#10094;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Preview" />
    <span class="next">&#10095;</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
